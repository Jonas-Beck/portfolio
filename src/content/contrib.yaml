# One entry per upstream repository. There is no state field: the contrib state
# is derived from `maintainer` and the pr states. `prs` is the evidence and needs
# at least one, except where Jonas maintains the repository: then the repository
# is the evidence and `prs` may be left out.

- slug: policy-reporter
  name: policy-reporter
  repo: kyverno/backstage-policy-reporter-plugin
  summary: Backstage plugin for displaying policy reports from tools like Kyverno, Trivy and Falco
  note: donated to the Kyverno CNCF project
  image: /policy-reporter.png
  maintainer: true

- slug: backstage-events-kafka
  name: backstage events kafka module
  repo: backstage/backstage
  summary: Module for Backstage's events plugin that subscribes to Kafka topics and exposes them through the internal event service, and publishes events back to Kafka
  note: contributed upstream
  prs:
    - title: "feat(events): add a new kafka module for events backend"
      url: https://github.com/backstage/backstage/pull/29315
      state: merged
    - title: "feat(events): add support for publishing to kafka and multiple instances"
      url: https://github.com/backstage/backstage/pull/32078
      state: merged

- slug: github-actions-cache-server
  name: github-actions-cache-server
  repo: falcondev-oss/github-actions-cache-server
  summary: Azure Blob Storage driver for the self-hosted GitHub Actions cache server, implementing the full storage interface alongside Helm chart values and Azurite-backed tests
  note: contributed upstream
  prs:
    - title: "feat(storage): add Azure Blob Storage driver"
      url: https://github.com/falcondev-oss/github-actions-cache-server/pull/280
      state: merged
